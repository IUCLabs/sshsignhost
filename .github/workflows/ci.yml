name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pre-commit:
    runs-on: iuclabs-k8s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uvx pre-commit run --all-files --show-diff-on-failure

  lint:
    runs-on: iuclabs-k8s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: go vet ./...

  test:
    runs-on: iuclabs-k8s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # runner image has no C toolchain, so no -race
      - run: go test -count=1 ./...

  build:
    runs-on: iuclabs-k8s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: go build -trimpath -ldflags="-s -w" ./...

  integration:
    runs-on: iuclabs-k8s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - env:
          VAULT_VERSION: 1.20.4
          VAULT_SHA256: fc5fb5d01d192f1216b139fb5c6af17e3af742aaeffc289fd861920ec55f2c9c
          SSHSIGNHOST_TEST_VAULT_ADDR: http://127.0.0.1:8200
          # Throwaway dev-mode server on loopback; this token grants nothing.
          VAULT_TOKEN: dev-root-token
        run: |
          curl -fsSL -o "$RUNNER_TEMP/vault.zip" "https://releases.hashicorp.com/vault/${VAULT_VERSION}/vault_${VAULT_VERSION}_linux_amd64.zip"
          echo "${VAULT_SHA256}  $RUNNER_TEMP/vault.zip" | sha256sum -c -
          unzip -o -q "$RUNNER_TEMP/vault.zip" -d "$RUNNER_TEMP/bin"
          "$RUNNER_TEMP/bin/vault" server -dev -dev-root-token-id="$VAULT_TOKEN" -dev-listen-address=127.0.0.1:8200 >"$RUNNER_TEMP/vault.log" 2>&1 &
          timeout 600 ./scripts/integration-test.sh || { cat "$RUNNER_TEMP/vault.log"; exit 1; }
