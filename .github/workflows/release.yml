name: release

on:
  push:
    tags: ["v[0-9]*"]

permissions: {}

jobs:
  release:
    uses: IUCLabs/workflows/.github/workflows/release-goreleaser.yml@v0.1.1
    permissions:
      contents: write
      id-token: write
      packages: write
    with:
      image: false
      vault_role: release-shared
