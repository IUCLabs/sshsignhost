when:
  - event: pull_request

# Kept out of test.yaml so the three required PR contexts (build/test/pre-commit)
# stay exactly what they were; this one needs a Vault next to it.
services:
  - name: vault
    image: hashicorp/vault:1.20
    environment:
      # Throwaway dev-mode server; this token grants nothing outside this pod.
      VAULT_DEV_ROOT_TOKEN_ID: dev-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    backend_options:
      kubernetes:
        serviceAccountName: default
        resources:
          requests:
            memory: 512Mi
            cpu: 1
          limits:
            memory: 2Gi
            cpu: 2

steps:
  - name: integration
    image: golang:1.25
    environment:
      SSHSIGNHOST_TEST_VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: dev-root-token
    commands:
      - go test -tags=integration -count=1 -v -run TestIntegration ./...
    backend_options:
      kubernetes:
        serviceAccountName: default
        resources:
          requests:
            memory: 512Mi
            cpu: 1
          limits:
            memory: 2Gi
            cpu: 2
