---
# nfpm config for building the sshsignhost RPM.
# Rendered through envsubst (see scripts/build-rpm.sh) then fed to `nfpm pkg`.

name: ${PACKAGE_NAME}
version: ${PACKAGE_VERSION}
release: ${PACKAGE_RELEASE}
arch: ${PACKAGE_ARCH}
platform: ${PACKAGE_PLATFORM}
section: default
priority: extra
description: "${PACKAGE_DESCRIPTION}"

maintainer: ${PACKAGE_MAINTAINER}
homepage: ${PACKAGE_HOMEPAGE}
license: ${PACKAGE_LICENSE}

disable_globbing: false

contents:
  # Puppet's generate() calls the binary at this exact path.
  - src: dist/sshsignhost
    dst: /usr/local/bin/sshsignhost
    file_info:
      mode: 0755
      owner: root
      group: root

  - src: dist/completions/sshsignhost.bash
    dst: /usr/share/bash-completion/completions/sshsignhost
    file_info:
      mode: 0644
  - src: dist/completions/_sshsignhost
    dst: /usr/share/zsh/site-functions/_sshsignhost
    file_info:
      mode: 0644
  - src: dist/completions/sshsignhost.fish
    dst: /usr/share/fish/vendor_completions.d/sshsignhost.fish
    file_info:
      mode: 0644
